<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Walk — Lewisham Dog Fouling Log</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#1d2925;--muted:#64726c;--line:#dbe2de;--accent:#176b48}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:#143d2e;color:#fff;padding:20px}.wrap{max-width:900px;margin:auto}h1{margin:0 0 6px;font-size:1.55rem}header p{margin:0;opacity:.9;font-size:.92rem}
main{padding:14px}.toolbar{position:sticky;top:0;z-index:10;background:rgba(244,246,245,.96);backdrop-filter:blur(8px);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}.toolbar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input[type=search]{flex:1;min-width:180px}.toolbar input,.toolbar select,.toolbar button{font:inherit;border:1px solid #bdc8c2;border-radius:9px;background:#fff;padding:10px}.toolbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}.count{font-size:.84rem;color:var(--muted);margin-top:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 7px rgba(0,0,0,.04)}.head{padding:14px}.date{font-weight:800;color:var(--accent);font-size:.92rem}.loc{font-weight:800;margin:4px 0 6px}.obs{color:var(--muted);font-size:.9rem;line-height:1.45}.entryno{font-size:.78rem;color:var(--muted);margin-top:7px}
.photos{display:flex;gap:2px;overflow:auto;background:#ddd}.photos img{height:150px;min-width:190px;max-width:260px;object-fit:cover;display:block}.no-photo{padding:12px;color:var(--muted);font-size:.85rem;background:#f8faf9}
.review{padding:12px 14px;border-top:1px solid var(--line);background:#fbfcfb}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buttons button{font:inherit;border:1px solid #bac6bf;border-radius:9px;background:#fff;padding:11px 8px;font-weight:750;cursor:pointer}.buttons button.selected{background:#1f2f29;color:#fff;border-color:#1f2f29}.buttons .wide{grid-column:1/-1}.note{width:100%;margin-top:8px;padding:10px;border:1px solid #c7d0cb;border-radius:9px;font:inherit}.saved{font-size:.82rem;color:var(--muted);margin-top:7px}.reviewed{outline:2px solid #acd0bb}.hidden{display:none!important}
footer{padding:24px 14px 40px;text-align:center;color:var(--muted);font-size:.8rem}
@media(min-width:700px){.buttons{grid-template-columns:repeat(5,1fr)}.buttons .wide{grid-column:auto}.photos img{height:190px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Review Walk</h1><p>Quickly mark whether each previously logged incident is still present, cleared, or has changed.</p></div></header>
<main class="wrap">
<div class="toolbar">
  <div class="toolbar-row">
    <input id="search" type="search" placeholder="Search location…">
    <select id="show"><option value="all">All entries</option><option value="unreviewed">Unreviewed only</option><option value="reviewed">Reviewed only</option></select>
    <button id="copy" class="primary" disabled>Copy review summary</button>
    <button id="clear" disabled>Clear selections</button>
  </div>
  <div id="count" class="count">Loading log…</div>
</div>
<div id="list"></div>
</main>
<footer>Review selections are stored only in this browser/device until you copy the summary and send it back to ChatGPT. They do not directly alter the public evidence log.</footer>
<script>
const KEY='lewDogFoulingReviewDraftV1';
let INCIDENTS=[],draft={};
try{draft=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){draft={}}
const $=id=>document.getElementById(id), list=$('list'), search=$('search'), show=$('show'), copy=$('copy'), clear=$('clear'), count=$('count');
const esc=s=>(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function save(){localStorage.setItem(KEY,JSON.stringify(draft));render()}
function setStatus(id,status){const note=(document.querySelector(`[data-id="${id}"] .note`)?.value||'').trim();if(status==='__undo')delete draft[id];else draft[id]={status,date:today(),note};save()}
function updateNote(id,value){if(draft[id]){draft[id].note=value.trim();localStorage.setItem(KEY,JSON.stringify(draft));updateCount()}}
function updateCount(){const n=Object.keys(draft).length;count.textContent=`${INCIDENTS.length} entries · ${n} reviewed on this device · ${INCIDENTS.length-n} unreviewed`;copy.disabled=!n;clear.disabled=!n}
function render(){const q=search.value.trim().toLowerCase(),mode=show.value;const rows=INCIDENTS.slice().sort((a,b)=>b.firstSeen.localeCompare(a.firstSeen)).filter(i=>(!q||[i.location,i.notes,i.displayFirstSeen].join(' ').toLowerCase().includes(q))&&(mode==='all'||(mode==='reviewed'&&draft[i.id])||(mode==='unreviewed'&&!draft[i.id])));list.innerHTML=rows.map(i=>{const d=draft[i.id];return `<article class="card ${d?'reviewed':''}" data-id="${i.id}"><div class="head"><div class="date">${esc(i.displayFirstSeen)}</div><div class="loc">${esc(i.location)}</div><div class="obs">${esc(i.notes)}</div><div class="entryno">Entry #${String(i.id).padStart(2,'0')}</div></div>${i.images?.length?`<div class="photos">${i.images.map(n=>`<img loading="lazy" src="images/${encodeURIComponent(n)}" alt="Entry ${i.id} evidence photo">`).join('')}</div>`:`<div class="no-photo">No photo currently attached</div>`}<div class="review"><div class="buttons">${['Still present','Cleared','Residue remains','New fouling at same spot','Unable to confirm'].map(st=>`<button class="${d?.status===st?'selected':''}" onclick="setStatus(${i.id},'${st.replace(/'/g,"\\'")}')">${st}</button>`).join('')}<button class="wide" onclick="setStatus(${i.id},'__undo')">Undo</button></div><input class="note" placeholder="Optional note…" value="${esc(d?.note||'')}" onchange="updateNote(${i.id},this.value)">${d?`<div class="saved">Selected: <b>${esc(d.status)}</b> · ${esc(d.date)}</div>`:''}</div></article>`}).join('')||'<p>No entries match this view.</p>';updateCount()}
async function load(){try{const txt=await fetch('index.html',{cache:'no-store'}).then(r=>r.text());const m=txt.match(/const INCIDENTS = (\[[\s\S]*?\]);\s*const esc=/);if(!m)throw new Error('Could not read incident data');INCIDENTS=JSON.parse(m[1]);render()}catch(e){count.textContent='Could not load the incident log. Refresh the page or open the main log first.';console.error(e)}}
search.oninput=render;show.onchange=render;
copy.onclick=async()=>{const lines=Object.entries(draft).sort((a,b)=>Number(a[0])-Number(b[0])).map(([id,r])=>{const i=INCIDENTS.find(x=>x.id===Number(id));return `Entry #${String(id).padStart(2,'0')} — ${i?.location||'Unknown location'} — ${r.status} — checked ${r.date}${r.note?` — ${r.note}`:''}`});const text=`Dog fouling review updates:\n${lines.join('\n')}`;try{await navigator.clipboard.writeText(text);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy review summary',1400)}catch(e){prompt('Copy this review summary:',text)}};
clear.onclick=()=>{if(confirm('Clear all review selections saved on this device?')){draft={};localStorage.removeItem(KEY);render()}};
load();
</script>
</body>
</html>
